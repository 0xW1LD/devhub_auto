[package]
name = "autopwn"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
http = "1.4.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.150"
strip-ansi-escapes = "0.2.1"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt", "net", "sync", "time", "macros", "rt-multi-thread", "io-util", "io-std"] }
tokio-tungstenite = "0.29.0"
tungstenite = "0.29.0"
